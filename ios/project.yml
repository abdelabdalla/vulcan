name: Vulcan
options:
  bundleIdPrefix: com.abdelabdalla
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Vulcan:
    type: application
    platform: iOS
    sources:
      - Vulcan
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Vulcan/Info.plist
      properties:
        CFBundleDisplayName: Vulcan
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Scan the pairing QR code shown on your PC.
        NSLocalNetworkUsageDescription: Vulcan connects to your PC on your local network.
        NSBonjourServices:
          - _vulcan._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.abdelabdalla.vulcan.pair
            CFBundleURLSchemes:
              - vulcan
  VulcanTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - VulcanTests
    dependencies:
      - target: Vulcan
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(inherited).tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Vulcan:
    build:
      targets:
        Vulcan: all
        VulcanTests: [test]
    test:
      targets:
        - VulcanTests
