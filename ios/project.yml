name: Vulcan
options:
  bundleIdPrefix: com.abdelabdalla
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Vulcan:
    type: application
    platform: iOS
    sources:
      - Vulcan
      - Shared
    dependencies:
      - target: ShareExtension
    entitlements:
      path: Vulcan/Vulcan.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)vulcan.shared
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Vulcan/Info.plist
      properties:
        CFBundleDisplayName: Vulcan
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Scan the pairing QR code shown on your PC.
        NSPhotoLibraryAddUsageDescription: Save photos and videos sent from your PC.
        NSBluetoothAlwaysUsageDescription: Vulcan uses Bluetooth to reach your PC when Wi-Fi isn't available.
        # Received files show up in the Files app under On My iPhone › Vulcan.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Shared with the Share extension, which reads the pairing to send files itself.
        VulcanKeychainGroup: $(AppIdentifierPrefix)vulcan.shared
        NSLocalNetworkUsageDescription: Vulcan connects to your PC on your local network.
        NSBonjourServices:
          - _vulcan._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.abdelabdalla.vulcan.pair
            CFBundleURLSchemes:
              - vulcan
  # "Vulcan" in any app's share sheet: sends any number of photos, videos or files to the PC.
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - Shared
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)vulcan.shared
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: $(inherited).share
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Vulcan
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        VulcanKeychainGroup: $(AppIdentifierPrefix)vulcan.shared
        NSLocalNetworkUsageDescription: Vulcan connects to your PC on your local network.
        NSBonjourServices:
          - _vulcan._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 200
              NSExtensionActivationSupportsMovieWithMaxCount: 200
              NSExtensionActivationSupportsFileWithMaxCount: 200
  VulcanTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - VulcanTests
    dependencies:
      - target: Vulcan
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(inherited).tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Vulcan:
    build:
      targets:
        Vulcan: all
        VulcanTests: [test]
    test:
      targets:
        - VulcanTests
